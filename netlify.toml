[[headers]]
  # Apunta al archivo de datos con la nueva extensión
  for = "/Build/*.data"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/octet-stream"

[[headers]]
  # Apunta al archivo wasm con la nueva extensión
  for = "/Build/*.wasm"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/wasm"

[[headers]]
  # Apunta al archivo javascript del framework con la nueva extensión
  for = "/Build/*.framework.js"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/javascript"
